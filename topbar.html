<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hobby Creatures - Topbar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design-tokens.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar">
  <button class="top-icon menu-toggle" id="menuToggle" aria-label="Toggle menu">
    <i class="bi bi-list"></i>
  </button>
  <div class="topbar-brand-mobile">
    <span class="brand-mark">HC</span>
    <div class="brand-text-mobile">
      <b>Hobby Creatures</b>
      <small>Order &amp; Production CRM</small>
    </div>
  </div>
  <div class="topbar-search">
    <i class="bi bi-search"></i>
    <input type="text" placeholder="Search orders, customers or phone...">
  </div>
  <div class="topbar-spacer"></div>
  <div class="topbar-actions">

    <div class="top-user">
      <span class="avatar">SA</span>
      <div class="top-user-text">
        <b>SuperAdmin</b>
        <small>Administrator</small>
      </div>
      <i class="bi bi-chevron-down"></i>
    </div>
  </div>
</header>
</body>
</html>
