<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hobby Creatures - Designer Topbar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/design-tokens.css">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<header class="designer-topbar">
  <button class="designer-top-icon designer-menu-toggle" id="designerMenuToggle" aria-label="Open menu">
    <i class="bi bi-list"></i>
  </button>
  <div class="designer-topbar-brand-mobile">
    <div class="designer-brand-mark">HC</div>
    <div class="designer-brand-text-mobile">
      <b>Hobby Creatures</b>
      <small>Design &amp; Production CRM</small>
    </div>
  </div>
  <div class="designer-topbar-search">
    <i class="bi bi-search"></i>
    <input type="search" placeholder="Search your design jobs...">
  </div>
  <div class="designer-topbar-spacer"></div>
  <div class="designer-topbar-actions">
    <button class="designer-top-icon" aria-label="Notifications">
      <i class="bi bi-bell"></i>
      <span class="designer-notification-count">3</span>
    </button>
    <div class="designer-top-user">
      <div class="designer-avatar">DK</div>
      <div class="designer-top-user-text">
        <b>Designer</b>
        <small>Designer</small>
      </div>
      <i class="bi bi-chevron-down"></i>
    </div>
  </div>
</header>
</body>
</html>
